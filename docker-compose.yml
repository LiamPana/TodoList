services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?variabile MYSQL_ROOT_PASSWORD mancante}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-todos}"
      MYSQL_USER: "${MYSQL_USER:-app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?variabile MYSQL_PASSWORD mancante}"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - todo-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "${APP_PORT:-5050}:5050"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: "${MYSQL_USER:-app}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?variabile MYSQL_PASSWORD mancante}"
      DB_NAME: "${MYSQL_DATABASE:-todos}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','5050')+'/health',timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  todo-net:
    name: todo-net

volumes:
  mysql-data:
    name: todo-mysql-data