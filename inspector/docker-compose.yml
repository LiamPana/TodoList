# Stack SEPARATO dall'applicazione: serve solo a ispezionare il database.
# Richiede che lo stack principale sia già avviato (crea la rete "todo-net").
services:
  adminer:
    image: adminer:latest
    container_name: db-inspector
    ports:
      - "${INSPECTOR_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - todo-net
    restart: unless-stopped

networks:
  todo-net:
    external: true
    name: todo-net
